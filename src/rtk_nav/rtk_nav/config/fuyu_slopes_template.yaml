# 馥裕搅拌站清扫坡面模板。填入现场 RTK 点位前不可用于路径规划。
# ①、⑤暂按屋脊南北向、各跨由西向东排列；②、③、④及玻璃房的坡向与数量均待现场确认。
# 名称末尾 N/S/E/W 表示坡面朝向，跨位 W/M/E 表示西/中/东跨；确认后按实际情况更名或调整区域。
# R03G 为东侧玻璃房预留区域；确认需要单独清扫后保留。
# 当前顺序仅用于列出区域，不代表实际清扫或桥架通行顺序。
areas:
  # ① 三联跨料棚
  - name: "R01_3B_W_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R01_3B_W_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R01_3B_M_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R01_3B_M_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R01_3B_E_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R01_3B_E_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }

  # ② 小库房；坡向和坡面数量待确认
  - name: "R02_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R02_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }

  # ③ 大库房及东侧玻璃房；坡向、坡面数量及玻璃房是否单独清扫待确认
  - name: "R03_N"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R03_S"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R03G_N"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R03G_S"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }

  # ④ 办公楼；坡向和坡面数量待确认
  - name: "R04_N"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R04_S"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }

  # ⑤ 二联跨
  - name: "R05_2B_W_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R05_2B_W_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R05_2B_E_W"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }
  - name: "R05_2B_E_E"
    calib_point_a: {lon: , lat: }
    calib_point_b: {lon: , lat: }
    calib_point_c: {lon: , lat: }

default:
  interval: 0.8
  start_corner: "top_left"
  swap_wh_select: false
  edge_distance_lon: 0.0
  edge_distance_lat: 0.0
  reverse_end_point: true
  headless: false
