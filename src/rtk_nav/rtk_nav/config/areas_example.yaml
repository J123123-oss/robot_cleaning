# 区域配置文件示例
# 添加/删除区域只需修改此文件，无需修改代码或launch文件
# 
# 格式说明：
# - areas: 区域列表，每个区域包含标定点和可选参数
# - 每个区域需要定义 calib_point_a, calib_point_b, calib_point_c (必填)
# - 可选参数：interval, start_corner, swap_wh_select, edge_distance_lon, edge_distance_lat, end_corner_mode
#
# 可选的 start_corner: top_left, top_right, bottom_left, bottom_right
# 可选的 end_corner_mode: diagonal (对角), opposite (对面/同侧)
# 可选的 swap_wh_select: True/False

areas:
  # 区域0
  - name: "zone_0"  # 可选的区域名称（用于日志显示）
    calib_point_a: {lon: 110.64741299779179, lat: 35.60593376188335}
    calib_point_b: {lon: 110.64741219706659, lat: 35.60611366491313}
    calib_point_c: {lon: 110.64726667869006, lat: 35.60611161096633}
    start_corner: "top_right"
    end_corner_mode: "diagonal"
    # interval: 9.0  # 可选，不设置则使用默认值
    # swap_wh_select: True
    # edge_distance_lon: 0.5
    # edge_distance_lat: 0.5

  # 区域1
  - name: "zone_1"
    calib_point_a: {lon: 110.64741366306355, lat: 35.60571889444015}
    calib_point_b: {lon: 110.64741283394737, lat: 35.60589706282963}
    calib_point_c: {lon: 110.64726808899731, lat: 35.605895621784235}
    start_corner: "top_left"
    end_corner_mode: "diagonal"
    # interval: 9.0
    # swap_wh_select: True
    # edge_distance_lon: 0.5
    # edge_distance_lat: 0.5

  # 区域2 (添加新区域只需在这里添加，无需修改其他区域编号)
  # - name: "zone_2"
  #   calib_point_a: {lon: xxx, lat: xxx}
  #   calib_point_b: {lon: xxx, lat: xxx}
  #   calib_point_c: {lon: xxx, lat: xxx}

# 全局默认参数（所有区域可继承，也可单独覆盖）
default:
  interval: 9.0
  start_corner: "top_left"
  swap_wh_select: True
  edge_distance_lon: 0.5
  edge_distance_lat: 0.5
  end_corner_mode: "opposite"  # diagonal / opposite
  headless: False
